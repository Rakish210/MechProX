name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux Qt system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxkbcommon-x11-0
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: pyright
      - name: Tests
        run: pytest -q
      - name: Alembic
        run: alembic upgrade head
