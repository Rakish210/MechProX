name: One-time obsolete branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded development branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "maintenance/core-foundation-hygiene"
            "phase-0/architecture-discovery"
            "phase-1/core-foundation"
            "phase-2/common-engineering-data-model"
            "phase-2/engineering-data-model"
            "phase-3/engineering-knowledge-registry"
            "feat/gas-demand-desktop-workflow"
            "fix/calculation-append-concurrency"
            "development/calculation-engine-core"
            "development/gas-demand-engine"
            "development/gas-workflow-ui"
            "development/integrated-foundation"
            "development/parameter-registry-ui"
          )

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              echo "Refusing to delete the default branch."
              exit 1
            fi

            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              echo "Deleted: ${branch}"
            elif gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" >/dev/null 2>&1; then
              echo "ERROR: branch still exists; deletion failed: ${branch}"
              exit 1
            else
              echo "Already absent: ${branch}"
            fi
          done

          echo "Branch cleanup completed. main was preserved.";
