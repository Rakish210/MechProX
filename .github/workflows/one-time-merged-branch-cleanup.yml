name: One-time merged branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-merged-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged maintenance branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="chore/purge-legacy-brand-references"
          if [[ "$branch" == "main" ]]; then
            echo "Refusing to delete the default branch."
            exit 1
          fi
          if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
            echo "Deleted merged branch: ${branch}"
          elif gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" >/dev/null 2>&1; then
            echo "ERROR: deletion failed."
            exit 1
          else
            echo "Branch already absent."
          fi
