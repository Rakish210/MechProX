[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechpro"
version = "0.1.0"
description = "Modular mechanical engineering automation platform (foundation)"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pyright>=1.1",
]

[project.scripts]
mechpro = "mechpro.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src", "tests"]
