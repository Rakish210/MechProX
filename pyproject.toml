[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechprox"
version = "0.2.0"
description = "MechProX — modular mechanical engineering automation platform"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.8,<3",
  "pint>=0.24,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pyright>=1.1",
]

[project.scripts]
mechprox = "mechprox.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src", "tests"]
